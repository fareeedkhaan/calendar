<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My First Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f9f9f9;
        }

        nav {
            background-color: #333;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
            font-size: 18px;
        }

        nav a:hover {
            color: yellow;
        }

        .section {
            padding: 40px;
            text-align: center;
        }

        h1 {
            color: #333;
        }

        p {
            font-size: 18px;
            color: #555;
        }

        img {
            width: 300px;
            margin-top: 20px;
            border-radius: 8px;
        }
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body>
    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <div id="home" class="section">
        <h1>Welcome to My Website</h1>
        <p>This is a simple beginner project using only HTML and CSS in one file.</p>
        <img src="https://via.placeholder.com/300" alt="Sample Image">
    </div>


    <div id="about" class="section" style="background-color: #eef;">
        <h1>About This Site</h1>
        <p>This site was made to help beginners understand how websites are built using basic HTML and CSS.</p>
        <img src="https://via.placeholder.com/300/87CEFA/000000?text=About+Image" alt="About Image">
    </div>

   
    <div id="contact" class="section">
        <h1>Contact Me</h1>
        <p>Email: example@email.com</p>
        <p>Phone: 123-456-7890</p>
    </div>

</body>
</html>
